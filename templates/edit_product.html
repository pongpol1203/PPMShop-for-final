{% extends "base.html" %}
{% block content %}
<div class="container mt-4 mb-5" style="max-width: 700px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-warning text-dark">
            <h5 class="mb-0">✏️ แก้ไขข้อมูลสินค้า</h5>
        </div>
        <div class="card-body bg-light">
            <!-- ฟอร์มแก้ไขสินค้า (ส่งข้อมูลแบบ POST และรองรับการอัปโหลดไฟล์) -->
            <form method="POST" enctype="multipart/form-data">
                
                <div class="mb-3">
                    <label class="form-label fw-bold">ชื่อสินค้า</label>
                    <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
                </div>

                <!-- 📍 แยกเป็นประเภทสินค้าและแบรนด์ -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">ประเภทสินค้า (Category)</label>
                        <input type="text" name="category" class="form-control" value="{{ product.category }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">แบรนด์ (Brand)</label>
                        <input type="text" name="brand" class="form-control" value="{{ product.brand }}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">รายละเอียดสินค้า</label>
                    <textarea name="description" class="form-control" rows="3" required>{{ product.description }}</textarea>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">ราคา (บาท)</label>
                        <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">จำนวนสต็อก (ชิ้น)</label>
                        <input type="number" name="stock" class="form-control" value="{{ product.stock }}" required>
                    </div>
                </div>

                <!-- 📍 ช่องเลือกสินค้าขายดี / สินค้ามาใหม่ (จัดระยะห่างใหม่ให้ดูสวยงามไม่ชิดขอบ) -->
                <div class="mb-4 p-3 bg-white rounded border shadow-sm">
                    <label class="form-label fw-bold text-secondary mb-2">🏷️ สถานะพิเศษของสินค้า</label>
                    <div class="row g-2">
                        <div class="col-md-6">
                            <div class="form-check py-1">
                                <input class="form-check-input" type="checkbox" name="is_best_seller" id="is_best_seller" value="1" {% if product.is_best_seller %}checked{% endif %}>
                                <label class="form-check-label fw-bold text-danger cursor-pointer" for="is_best_seller">
                                    🔥 สินค้าขายดี (Best Seller)
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check py-1">
                                <input class="form-check-input" type="checkbox" name="is_new" id="is_new" value="1" {% if product.is_new %}checked{% endif %}>
                                <label class="form-check-label fw-bold text-success cursor-pointer" for="is_new">
                                    ✨ สินค้ามาใหม่ (New Arrival)
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">เปลี่ยนรูปภาพหลัก (ถ้าต้องการ)</label>
                    <input type="file" name="image" class="form-control" accept="image/*">
                    <small class="text-muted">รูปปัจจุบัน: {{ product.image_url }}</small>
                </div>

                <!-- ช่องอัปโหลดรูปภาพเสริม (Gallery) -->
                <div class="mb-4">
                    <label class="form-label fw-bold">เพิ่มรูปภาพเสริม (Gallery) หลายรูปได้</label>
                    <input type="file" name="extra_images" class="form-control" accept="image/*" multiple>
                    <small class="text-muted">สามารถกดเลือกไฟล์หลายรูปพร้อมกันได้</small>
                </div>

                <button type="submit" class="btn btn-warning w-100 fw-bold">บันทึกการแก้ไข</button>
                <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary w-100 mt-2">ย้อนกลับ</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
